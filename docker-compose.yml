# Sobe o motor com o log no PostgreSQL e os 3 reinos de teste governados por bots.
# Modo acelerado: 360 horas de mundo por hora real (1 dia de mundo a cada 4 minutos).
# Para o relógio real, troque ARENA_RELOGIO para "real".
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena"]
      interval: 2s
      timeout: 3s
      retries: 30

  motor:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://arena:arena@postgres:5432/arena
      ARENA_RELOGIO: acelerado
      ARENA_VELOCIDADE: "360"
      ARENA_SEMENTE: "42"
      ARENA_BOTS: todos
    ports:
      - "8000:8000"

volumes:
  dados_pg:
