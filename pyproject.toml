[project]
name = "arena-de-reinos"
version = "0.1.0"
description = "Protótipo do motor do mundo da Arena de Reinos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
